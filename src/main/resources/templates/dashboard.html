<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Credit System 대시보드</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="page">
    <header class="page-header">
        <h1>Credit System</h1>
        <span class="user-tag">로그인: <strong th:text="${username}">username</strong></span>
    </header>

    <div class="card-row">
        <section class="card">
            <h2>잔액</h2>
            <p class="balance-value"><span id="balance">-</span></p>
            <form id="charge-form" class="inline-form">
                <input type="number" id="charge-amount" min="1" value="1000" required>
                <button type="submit">충전</button>
            </form>
        </section>

        <section class="card">
            <h2>새 생성 요청</h2>
            <form id="job-form" class="inline-form">
                <input type="text" id="prompt" placeholder="예: a cat wearing sunglasses" required>
                <button type="submit" id="submit-btn">요청</button>
            </form>
        </section>
    </div>

    <div class="tabs">
        <button type="button" id="tab-btn-jobs" class="active" onclick="showTab('jobs')">Job 목록</button>
        <button type="button" id="tab-btn-ledger" onclick="showTab('ledger')">Ledger 내역</button>
    </div>

    <section id="jobs-tab" class="tab-panel">
        <div class="table-wrap">
            <table>
                <thead><tr><th>ID</th><th>상태</th><th>시도</th><th>차감액</th><th>프롬프트</th><th>결과</th></tr></thead>
                <tbody id="jobs-body"></tbody>
            </table>
        </div>
    </section>

    <section id="ledger-tab" class="tab-panel hidden">
        <div class="table-wrap">
            <table>
                <thead><tr><th>ID</th><th>타입</th><th>금액</th><th>Job ID</th><th>시각</th></tr></thead>
                <tbody id="ledger-body"></tbody>
            </table>
        </div>
    </section>
</div>

<script>
function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
}

async function loadBalance() {
    const res = await fetch('/api/organizations/me/balance');
    const data = await res.json();
    document.getElementById('balance').textContent = data.balance;
}

async function loadJobs() {
    const res = await fetch('/api/jobs');
    const jobs = await res.json();
    document.getElementById('jobs-body').innerHTML = jobs.length ? jobs.map(job => `
        <tr>
            <td>${job.id}</td>
            <td><span class="badge badge-${job.status.toLowerCase()}">${job.status}</span></td>
            <td>${job.attemptNo}</td>
            <td>${job.holdAmount}</td>
            <td>${escapeHtml(job.prompt)}</td>
            <td>${escapeHtml(job.resultUrl ?? '')}</td>
        </tr>`).join('') : '<tr><td class="empty" colspan="6">아직 생성 요청이 없습니다.</td></tr>';
}

async function loadLedger() {
    const res = await fetch('/api/ledger');
    const entries = await res.json();
    document.getElementById('ledger-body').innerHTML = entries.length ? entries.map(entry => `
        <tr>
            <td>${entry.id}</td>
            <td>${entry.type}</td>
            <td>${entry.amount}</td>
            <td>${entry.jobId ?? ''}</td>
            <td>${entry.createdAt}</td>
        </tr>`).join('') : '<tr><td class="empty" colspan="5">아직 내역이 없습니다.</td></tr>';
}

function showTab(name) {
    document.getElementById('jobs-tab').classList.toggle('hidden', name !== 'jobs');
    document.getElementById('ledger-tab').classList.toggle('hidden', name !== 'ledger');
    document.getElementById('tab-btn-jobs').classList.toggle('active', name === 'jobs');
    document.getElementById('tab-btn-ledger').classList.toggle('active', name === 'ledger');
    if (name === 'ledger') {
        loadLedger();
    }
}

document.getElementById('charge-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const amount = Number(document.getElementById('charge-amount').value);
    await fetch('/api/organizations/me/charge', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ amount })
    });
    await loadBalance();
});

document.getElementById('job-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const submitBtn = document.getElementById('submit-btn');
    submitBtn.disabled = true;
    try {
        const prompt = document.getElementById('prompt').value;
        const idemKey = crypto.randomUUID();
        await fetch('/api/jobs', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ idemKey, prompt })
        });
        document.getElementById('prompt').value = '';
        await loadJobs();
        await loadBalance();
    } finally {
        submitBtn.disabled = false;
    }
});

loadBalance();
loadJobs();
setInterval(() => { loadJobs(); loadBalance(); }, 3000);
</script>
</body>
</html>
