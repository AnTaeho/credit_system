spring:
  application:
    name: credit_system
  datasource:
    url: jdbc:mysql://localhost:3306/credit_system
    username: root
    password: an902318
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379

app:
  scheduling:
    enabled: true
  worker:
    enabled: true
    batch-size: 20
  seed:
    enabled: true
  generation:
    cost: 100
    max-attempts: 3
  stub:
    failure-rate: 0.3
    min-delay-millis: 3000
    max-delay-millis: 7000
  heartbeat:
    timeout-seconds: 10
    refresh-interval-seconds: 5
  processing:
    timeout-seconds: 60

logging:
  level:
    com.example.credit_system: info
